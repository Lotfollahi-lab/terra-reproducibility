  # Dataloader settings (from pretraining config)
  batch_size: 144  
  pin_memory: true
  num_workers: 16  
  drop_last: true

  # Masking strategy 
  sample_segments: false  
  sample_gene_masks: true

# Finetuning hyperparameters
finetune:
  # Training settings 
  num_epochs: 20  
  lr: 0.001  
  warmup_epochs: 2  
  start_lr: 0.00001  
  final_lr: 0.00001 
  weight_decay: 0.04  
  final_weight_decay: 0.4  
  
  # EMA (Exponential Moving Average) for target encoder 
  ema_momentum: 0.9995  
  final_ema_momentum: 1.0  
  
  # Loss functio
  loss_fn_type: 'smooth_l1'  
  
  # Gradient clipping 
  clip_grad: 2.0  
  
  # Mixed precision training 
  use_bfloat16: true  
  
  # PEFT (Parameter-Efficient Fine-Tuning) - LoRA 
  use_peft: true
  peft_method: 'lora'
  peft_rank: 16  
  peft_alpha:  256 
  peft_dropout: 0.1
  peft_bias: 'none'  
  peft_target_modules: ['qkv', 'proj', 'fc1', 'fc2']  
  #peft_target_modules: ['qkv', 'proj'] 

  # Checkpoint saving
  save_every: 1  # Save every epoch 

