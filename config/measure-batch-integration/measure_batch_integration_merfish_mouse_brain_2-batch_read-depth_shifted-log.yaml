experiment:
  tokenizer: "cell-neighborhood-tokenizer"
  dataset_name: "merfish_mouse_brain_2-batch"
  species: "mus_musculus"
  n_batches: 2
  nproc: 2
  overwrite: False
  # model_input_size: 2244 # uncomment to manually set the model input size

wandb:
  project: "TERRA"
  job_type: "measure_batch_integration"
  save_artifact: False
  tags: ["measure-batch-integration", "merfish-mouse-brain-2batch", "read-depth", "shifted-log"]
  mode: "offline"

paths:
  data_directory_path: "/lustre/scratch126/cellgen/team361/am84/TERRA/datasets/am84/st_data/"
  tokenizer_directory_path: "/lustre/scratch126/cellgen/team361/am84/TERRA/datasets/am84/tokenizer/"
  profiler_path: "/lustre/scratch126/cellgen/team361/am84/TERRA/logs/"

tokenization:
  use_generator: True
  add_cls_tokens: False
  use_separate_cell_and_neighborhood_tokens: False
  norm_method: "shifted_log"
  norm_factor: "read_depth"
  prenormalize: False
  processing_mode: "parallel"
  custom_attr_name_dict: {"cell_type": "cell_types",
                          "brain_section_label": "brain_section_label",
                          "major_brain_region": "major_brain_region",
                          "ccf_region_name": "ccf_region_name",
                          "donor_id": "donor_id",
                          "brain_section_label": "sample_id",
                          "batch": "batch_id"}
  num_shards: 2
  keep_in_memory: False
  label_cats: ["cell_types", "niche_types"]

pytorch:
  vocab_size: 1087
  seq_len_cell: 411
  seq_len_neighborhood: 809
  has_cls: True
  sampling_strategy: "normalized_count_rank_sampling"
  sampling_seed: 42

batch_integration:
  data_file_format: "anndata"
  plot_umap: True
  compute_blisi: True