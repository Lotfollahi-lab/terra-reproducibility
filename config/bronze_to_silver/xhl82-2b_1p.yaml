experiment:
  name: xhl82-2b_1p
  description: Xenium Human Lung Cancer (dataset-id 82) | 2 batch | 1 panel | Download from 10x Genomics to bronze and preprocess to silver
  study: Post-Xenium Technical Note Xenium v1 and Xenium Prime 5K for FFPE Human Lung Cancer

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: online
  download_params:
    redownload: false
    urls:
      - https://cf.10xgenomics.com/samples/xenium/3.0.0/Xenium_V1_Human_Lung_Cancer_FFPE/Xenium_V1_Human_Lung_Cancer_FFPE_outs.zip
      - https://s3-us-west-2.amazonaws.com/10x.files/samples/xenium/3.0.0/Xenium_Prime_Human_Lung_Cancer_FFPE/Xenium_Prime_Human_Lung_Cancer_FFPE_outs.zip
  file_names:
    - Xenium_V1_Human_Lung_Cancer_FFPE
    - Xenium_Prime_Human_Lung_Cancer_FFPE

harmonization:
  uns:
    dataset_id: 82
    assay: xenium
    species: homo_sapiens
    tissue: lung
    sample_condition_map: {
      'Xenium_V1_Human_Lung_Cancer_FFPE': 'adenocarcinoma',
      'Xenium_Prime_Human_Lung_Cancer_FFPE': 'adenocarcinoma',
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

