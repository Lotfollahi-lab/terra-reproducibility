experiment:
  name: xhb81-1b_1p
  description: Xenium Human Breast Cancer (Prime) (dataset-id 81) | 1 batch | 1 panel | Download from 10x Genomics to bronze and preprocess to silver
  study: FFPE Human Breast Cancer with 5K Human Pan Tissue and Pathways Panel plus 100 Custom Genes

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: online
  download_params:
    redownload: false
    urls:
      - https://s3-us-west-2.amazonaws.com/10x.files/samples/xenium/3.0.0/Xenium_Prime_Breast_Cancer_FFPE/Xenium_Prime_Breast_Cancer_FFPE_outs.zip
  file_names:
    - Xenium_Prime_Breast_Cancer_FFPE

harmonization:
  uns:
    dataset_id: 81
    assay: xenium
    species: homo_sapiens
    tissue: breast
    condition: invasive_ductal_carcinoma # 'breast_cancer'
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

