experiment:
  name: xhs31-2b_1p
  description: Xenium Human Skin (dataset-id 31) | 2 batch | 1 panel | Download from 10x Genomics to Bronze and preprocess to silver
  study: Human Skin Preview Data

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: online
  download_params:
    redownload: false
    urls:
      - https://cf.10xgenomics.com/samples/xenium/1.6.0/Xenium_V1_hSkin_Melanoma_Base_FFPE/Xenium_V1_hSkin_Melanoma_Base_FFPE_outs.zip
      - https://cf.10xgenomics.com/samples/xenium/1.7.0/Xeniumranger_V1_hSkin_Melanoma_Add_on_FFPE/Xeniumranger_V1_hSkin_Melanoma_Add_on_FFPE_outs.zip
  file_names:
    - Xenium_V1_hSkin_Melanoma_Base_FFPE
    - Xeniumranger_V1_hSkin_Melanoma_Add_on_FFPE

harmonization:
  uns:
    dataset_id: 31
    assay: xenium
    species: homo_sapiens
    tissue: skin
    file_name_condition_map: {
      'Xenium_V1_hSkin_Melanoma_Base_FFPE': 'melanoma',
      'Xeniumranger_V1_hSkin_Melanoma_Add_on_FFPE': 'melanoma',
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

