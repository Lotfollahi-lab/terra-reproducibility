experiment:
  name: xhc45-1b_1p
  description: Xenium Human Cervical Cancer (Prime)(dataset-id 45) | 1 batch | 1 panel | Download from 10x Genomics to Bronze and preprocess to silver
  study: FFPE Human Cervical Cancer with 5K Human Pan Tissue and Pathways Panel plus 100 Custom Genes

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: online
  download_params:
    redownload: false
    urls:
      - https://s3-us-west-2.amazonaws.com/10x.files/samples/xenium/3.0.0/Xenium_Prime_Cervical_Cancer_FFPE/Xenium_Prime_Cervical_Cancer_FFPE_outs.zip
  file_names:
    - Xenium_Prime_Cervical_Cancer_FFPE

harmonization:
  uns:
    dataset_id: 45
    assay: xenium
    species: homo_sapiens
    tissue: cervix
    file_name_condition_map: {
      'Xenium_Prime_Cervical_Cancer_FFPE': 'cervical_cancer',
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

