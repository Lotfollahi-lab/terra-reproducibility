experiment:
  name: xhln1004-1b_1p
  description: Xenium TCR (dataset-id 1004) | 1 batch | 1 panel | Preprocess to silver
  study: Mats & Sergio Xenium

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: offline
  download_params:
    redownload: false
    urls: []
  file_names:
    - NSCLC_healthy_lymph_node.h5ad

harmonization:
  uns:
    dataset_id: 1004
    assay: xenium
    species: homo_sapiens
    tissue: lymph node
    file_name_condition_map: {
      'NSCLC_healthy_lymph_node': 'healthy',
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {
    'X_coordinate': 'x_centroid',
    'Y_coordinate': 'y_centroid',
  }
  misc:
    min_genes: 10

