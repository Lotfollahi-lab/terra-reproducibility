experiment:
  name: "xhl40-2b_2p"
  description: "Xenium Human Liver  (dataset-id 40) | 2 batch | 2 panel | Download from 10x Genomics to Bronze and preprocess to silver"
  study: "Human Liver Cancer Preview Data"

paths:
  data_directory_path: "/lustre/scratch126/cellgen/team361/DATASETS"

dataset:
  source: "online"
  download_params: {
    redownload: False,
    urls: [
            "https://cf.10xgenomics.com/samples/xenium/1.9.0/Xenium_V1_hLiver_nondiseased_section_FFPE/Xenium_V1_hLiver_nondiseased_section_FFPE_outs.zip", 
            "https://cf.10xgenomics.com/samples/xenium/1.9.0/Xenium_V1_hLiver_cancer_section_FFPE/Xenium_V1_hLiver_cancer_section_FFPE_outs.zip"
          ],
    file_names: [
                "Xenium_V1_hLiver_nondiseased_section_FFPE_outs",
                "Xenium_V1_hLiver_cancer_section_FFPE_outs"
              ],
  }
  overwrite: True

harmonization:
  uns: {
    'dataset_id': 40,
    'assay': 'xenium',
    'species': 'homo_sapiens',
    'tissue': 'liver',
    'sample_condition_map': {
      'Xenium_V1_hLiver_nondiseased_section_FFPE_outs': 'healthy',
      'Xenium_V1_hLiver_cancer_section_FFPE_outs': 'hepatocellular_carcinoma' # 'liver_cancer',
      }
  }
  batch: {
    'split_by_batch': False,
    'sample_batch_map': {},
  }
  key_mappings: {}
  misc: {
    'min_genes': 10,
  }