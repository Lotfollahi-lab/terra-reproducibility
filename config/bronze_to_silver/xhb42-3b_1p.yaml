experiment:
  name: xhb42-3b_1p
  description: Xenium Human Brain  (dataset-id 42) | 3 batch | 1 panel | Download from 10x Genomics to Bronze and preprocess to silver
  study: Xenium Human Brain Preview Data

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: online
  download_params:
    redownload: false
    urls:
      - https://cf.10xgenomics.com/samples/xenium/1.3.0/Xenium_V1_FFPE_Human_Brain_Healthy_With_Addon/Xenium_V1_FFPE_Human_Brain_Healthy_With_Addon_outs.zip
      - https://cf.10xgenomics.com/samples/xenium/1.3.0/Xenium_V1_FFPE_Human_Brain_Glioblastoma_With_Addon/Xenium_V1_FFPE_Human_Brain_Glioblastoma_With_Addon_outs.zip
      - https://cf.10xgenomics.com/samples/xenium/1.3.0/Xenium_V1_FFPE_Human_Brain_Alzheimers_With_Addon/Xenium_V1_FFPE_Human_Brain_Alzheimers_With_Addon_outs.zip
  file_names:
    - Xenium_V1_FFPE_Human_Brain_Healthy_With_Addon
    - Xenium_V1_FFPE_Human_Brain_Glioblastoma_With_Addon
    - Xenium_V1_FFPE_Human_Brain_Alzheimers_With_Addon

harmonization:
  uns:
    dataset_id: 42
    assay: xenium
    species: homo_sapiens
    tissue: brain
    sample_condition_map: {
      'Xenium_V1_FFPE_Human_Brain_Healthy_With_Addon': 'healthy',
      'Xenium_V1_FFPE_Human_Brain_Glioblastoma_With_Addon': 'glioblastoma',
      'Xenium_V1_FFPE_Human_Brain_Alzheimers_With_Addon': 'alzheimer_disease'
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

