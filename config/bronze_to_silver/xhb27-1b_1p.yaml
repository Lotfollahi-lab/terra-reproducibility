experiment:
  name: xhb27-1b_1p
  description: Xenium Human Breast Cancer (dataset-id 27) | 1 batch | 1 panel | Download from 10x Genomics to Bronze and preprocess to silver
  study: Xenium FFPE Human Breast with Custom Add-on Panel

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: online
  download_params:
    redownload: false
    urls:
      - https://s3-us-west-2.amazonaws.com/10x.files/samples/xenium/1.3.0/Xenium_V1_FFPE_Human_Breast_IDC_With_Addon/Xenium_V1_FFPE_Human_Breast_IDC_With_Addon_outs.zip
  file_names:
    - Xenium_V1_FFPE_Human_Breast_IDC_With_Addon_1

harmonization:
  uns:
    dataset_id: 27
    assay: xenium
    species: homo_sapiens
    tissue: breast
    file_name_condition_map: {
      'Xenium_V1_FFPE_Human_Breast_IDC_With_Addon_1': 'invasive_ductal_breast_carcinoma',
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

