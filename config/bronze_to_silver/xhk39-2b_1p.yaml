experiment:
  name: xhk39-2b_1p
  description: Xenium Human Kidney  (dataset-id 39) | 2 batch | 1 panel | Download from 10x Genomics to Bronze and preprocess to silver
  study: Xenium Human Kidney 1

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: online
  download_params:
    redownload: false
    urls:
      - https://cf.10xgenomics.com/samples/xenium/1.5.0/Xenium_V1_hKidney_cancer_section/Xenium_V1_hKidney_cancer_section_outs.zip
      - https://cf.10xgenomics.com/samples/xenium/1.5.0/Xenium_V1_hKidney_nondiseased_section/Xenium_V1_hKidney_nondiseased_section_outs.zip
  file_names:
    - Xenium_V1_hKidney_cancer_section
    - Xenium_V1_hKidney_nondiseased_section

harmonization:
  uns:
    dataset_id: 39
    assay: xenium
    species: homo_sapiens
    tissue: kidney
    file_name_condition_map: {
      'Xenium_V1_hKidney_cancer_section': 'papillary_renal_cell_carcinoma',
      'Xenium_V1_hKidney_nondiseased_section': 'healthy',
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

