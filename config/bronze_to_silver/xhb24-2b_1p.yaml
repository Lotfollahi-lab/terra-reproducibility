experiment:
  name: xhb24-2b_1p
  description: Xenium Human Breast Cancer (dataset-id 24) | 2 batch | 1 panel | Download from 10x Genomics to Bronze and preprocess to silver
  study: FFPE Human Breast using the Entire Sample Area

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: online
  download_params:
    redownload: false
    urls:
      - https://s3-us-west-2.amazonaws.com/10x.files/samples/xenium/1.0.2/Xenium_V1_FFPE_Human_Breast_IDC_Big_1/Xenium_V1_FFPE_Human_Breast_IDC_Big_1_outs.zip
      - https://s3-us-west-2.amazonaws.com/10x.files/samples/xenium/1.0.2/Xenium_V1_FFPE_Human_Breast_IDC_Big_2/Xenium_V1_FFPE_Human_Breast_IDC_Big_2_outs.zip
  file_names:
    - Xenium_V1_FFPE_Human_Breast_IDC_Big_1_outs
    - Xenium_V1_FFPE_Human_Breast_IDC_Big_2_outs

harmonization:
  uns:
    dataset_id: 24
    assay: xenium
    species: homo_sapiens
    tissue: breast
    sample_condition_map: {
      'Xenium_V1_FFPE_Human_Breast_IDC_Big_1_outs': 'invasive_ductal_carcinoma',
      'Xenium_V1_FFPE_Human_Breast_IDC_Big_2_outs': 'invasive_ductal_carcinoma',
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

