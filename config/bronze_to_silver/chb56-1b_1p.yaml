experiment:
  name: chb56-1b_1p
  description: CosMx Human Brain (dataset-id 56) | 1 batch | 1 panel | Download from NanoString to Bronze and preprocess to silver
  study: Nanostring CosMx SMI Datasets

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: true
  source: online
  download_params:
    redownload: false
    urls:
      - https://smi-public.objects.liquidweb.services/6k_release/flatFiles.zip
  file_names:
    - CosMx_Human_FFPE_FrontalCortex

harmonization:
  uns:
    dataset_id: 56
    assay: cosmx
    species: homo_sapiens
    tissue: brain
    sample_condition_map: {
      'CosMx_Human_FFPE_FrontalCortex': 'healthy'
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

