experiment:
  name: xho47-1b_1p
  description: Xenium Human Ovary (Prime)(dataset-id 47) | 1 batch | 1 panel | Download from 10x Genomics to bronze and preprocess to silver. Manually split into two sections (S1 and S2) because of space.
  study: Fresh Frozen Human Ovarian Adenocarcinoma with 5K Human Pan Tissue and Pathways Panel

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: online
  download_params:
    redownload: false
    urls:
      - https://s3-us-west-2.amazonaws.com/10x.files/samples/xenium/3.0.0/Xenium_Prime_Human_Ovary_FF/Xenium_Prime_Human_Ovary_FF_outs.zip
  file_names:
    - Xenium_Prime_Human_Ovary_FF

harmonization:
  uns:
    dataset_id: 47
    assay: xenium
    species: homo_sapiens
    tissue: ovary
    sample_condition_map: {
      'Xenium_Prime_Human_Ovary_FF': 'adenocarcinoma',
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

