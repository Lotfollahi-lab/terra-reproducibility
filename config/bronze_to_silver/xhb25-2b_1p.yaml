experiment:
  name: xhb25-2b_1p
  description: Xenium Human Breast Cancer (dataset-id 25) | 2 batch | 1 panel | Download from 10x Genomics to Bronze and preprocess to silver
  study: FFPE Human Breast with Custom Add-on Panel

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: online
  download_params:
    redownload: false
    urls:
      - https://s3-us-west-2.amazonaws.com/10x.files/samples/xenium/1.0.2/Xenium_V1_FFPE_Human_Breast_IDC_With_Addon/Xenium_V1_FFPE_Human_Breast_IDC_With_Addon_outs.zip
      - https://cf.10xgenomics.com/samples/xenium/1.0.2/Xenium_V1_FFPE_Human_Breast_ILC_With_Addon/Xenium_V1_FFPE_Human_Breast_ILC_With_Addon_outs.zip
  file_names:
    - Xenium_V1_FFPE_Human_Breast_IDC_With_Addon
    - Xenium_V1_FFPE_Human_Breast_ILC_With_Addon

harmonization:
  uns:
    dataset_id: 25
    assay: xenium
    species: homo_sapiens
    tissue: breast
    sample_condition_map: {
      'Xenium_V1_FFPE_Human_Breast_IDC_With_Addon': 'invasive_ductal_carcinoma',
      'Xenium_V1_FFPE_Human_Breast_ILC_With_Addon': 'invasive_lobular_carcinoma',
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

