experiment:
  name: xhl41-2b_1p
  description: Xenium Human Lung  (dataset-id 41) | 2 batch | 1 panel | Download from 10x Genomics to Bronze and preprocess to silver
  study: Human Lung Cancer Preview Data

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: false
  source: online
  download_params:
    redownload: false
    urls:
      - https://cf.10xgenomics.com/samples/xenium/1.3.0/Xenium_Preview_Human_Non_diseased_Lung_With_Add_on_FFPE/Xenium_Preview_Human_Non_diseased_Lung_With_Add_on_FFPE_outs.zip
      - https://s3-us-west-2.amazonaws.com/10x.files/samples/xenium/1.3.0/Xenium_Preview_Human_Lung_Cancer_With_Add_on_2_FFPE/Xenium_Preview_Human_Lung_Cancer_With_Add_on_2_FFPE_outs.zip
  file_names:
    - Xenium_Preview_Human_Non_diseased_Lung_With_Add_on_FFPE_outs
    - Xenium_Preview_Human_Lung_Cancer_With_Add_on_2_FFPE_outs

harmonization:
  uns:
    dataset_id: 41
    assay: xenium
    species: homo_sapiens
    tissue: lung
    sample_condition_map: {
      'Xenium_Preview_Human_Non_diseased_Lung_With_Add_on_FFPE_outs': 'healthy',
      'Xenium_Preview_Human_Lung_Cancer_With_Add_on_2_FFPE_outs': 'adenocarcinoma'
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

