experiment:
  name: chl57-2b_1p
  description: CosMx Human Liver (dataset-id 57) | 2 batch | 1 panel | Download from NanoString to bronze and preprocess to silver
  study: Nanostring CosMx SMI Datasets

paths:
  data_directory_path: /lustre/scratch126/cellgen/team361/DATASETS

dataset:
  overwrite: true
  source: directories
  download_params:
    redownload: false
    urls: []
  file_names:
    - CosMx_Human_FFPE_Liver_Cancer
    - CosMx_Human_FFPE_Liver_Normal

harmonization:
  uns:
    dataset_id: 57
    assay: cosmx
    species: homo_sapiens
    tissue: liver
    file_name_condition_map: {
      'CosMx_Human_FFPE_Liver_Normal': 'healthy',
      'CosMx_Human_FFPE_Liver_Cancer': 'hepatocellular_carcinoma'
      }
  batch:
    split_by_batch: false
    sample_batch_map: {}
  key_mappings: {}
  misc:
    min_genes: 10

