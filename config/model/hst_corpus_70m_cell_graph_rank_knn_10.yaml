data:
  dataset_name: 'hst_corpus_70m'
  raw_data_folder_path: '/lustre/scratch126/cellgen/team361/DATASETS/silver/hst_corpus_70m'
  token_dict_folder_path: '/lustre/scratch126/cellgen/team361/DATASETS/tokenizer/token_dictionary_homo_sapiens.pkl'
  tokenized_data_folder_path: '/lustre/scratch126/cellgen/team361/DATASETS/gold/cell-graph-tokenizer/hst_corpus_70m/hst_corpus_70m_32_None_None_None_None_None_shifted_log_knn_6.dataset'
  precomputed_split: '/lustre/scratch126/cellgen/team361/DATASETS/tokenizer/hst_corpus_70m_32_None_None_None_None_None_shifted_log_knn_6_precomputed_split_train.pkl'
  precomputed_n_nonzero_tokens: '/lustre/scratch126/cellgen/team361/DATASETS/tokenizer/hst_corpus_70m_32_None_None_None_None_None_shifted_log_knn_6_n_nonzero_tokens_train.pkl'
  tokenizer_type: 'cell_graph'
  random_state: 0
  sample_subset: False
  split: 0
  stratify: False
  seq_len_cell: 64 # 64, 256
  seq_len_neighborhood: 384 # 384, 2816
  n_segments: 7 # 7, 11; number of unique segment tokens (gene segments)
  sampling_strategy: null # null, 'rand_sampling', 'norm_count_rank_sampling', 'rand_sampling_rep', 'norm_count_rank_sampling_rep'
  batch_size: 32 # 32, 256
  num_workers: 12 # 24
  pin_memory: True
meta:
  add_cls: False
  gt_type: 'rank' # 'rank', 'counts'
  enc_depth: 6
  enc_emb_dim: 1024
  pred_depth: 2
  pred_emb_dim: 1024
  special_tokens: ['assay', 'tissue', 'gene_panel', 'batch'] # ['batch'], ['assay', 'tissue', 'gene_panel', 'batch']
  pos_learnable: False
  seg_learnable: False
  use_bfloat16: True
  use_flash_attention: True
  centering: False
  center_momentum: 0.99
mask:
  n_contexts: 1
  n_targets: 5 # this is the number of blocks in block masking
  block_masking: True # this doesn't have meaning in block masking.
  context_mask_size: 200 # this doesn't have meaning in block masking.
  target_mask_size: 50 # this doesn't have meaning in block masking.
  per_block_mask_ratio: 0.5 # [0.5, 0.8]
optimization:
  warmup: 0
  epochs: 100
  ema:
  - 0.9 # 0.7
  - 1.0
  start_lr: 2.0e-05
  lr: 2.0e-05
  final_lr: 2.0e-05
  weight_decay: 0.04
  final_weight_decay: 0.4
  ipe_scale: 1.0
state:
  log_freq: 20
  checkpoint_freq: 1
  write_tag: terra
  read_timestamp: ''
  folder_path: null
  load_checkpoint: False # true, false
  read_checkpoint: null # null, 'terra-ep5.pth.tar'
