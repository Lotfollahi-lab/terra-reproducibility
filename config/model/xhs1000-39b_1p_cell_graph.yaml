data:
  dataset_name: 'xhs1000-39b_1p'
  raw_data_folder_path: '/lustre/scratch126/cellgen/team361/DATASETS/silver/xhs1000-39b_1p'
  token_dict_folder_path: '/lustre/scratch126/cellgen/team361/DATASETS/tokenizer/cell-graph-tokenizer/xhs1000-39b_1p/token_dictionary.pkl'
  tokenized_data_folder_path: '/lustre/scratch126/cellgen/team361/DATASETS/gold/cell-graph-tokenizer/xhs1000-39b_1p/xhs1000-39b_1p_16_None_shifted_log_knn_10_1408.dataset'
  tokenizer_type: 'cell_graph'
  n_special_values: 43 # from token dictionary ('/lustre/scratch126/cellgen/team361/DATASETS/tokenizer/cell-graph-tokenizer/xhs1000-39b_1p/token_dictionary.pkl')
  random_state: 0
  sample_subset: False
  split: 0
  test_batch_ids: ['1000_batch11', '1000_batch19', '1000_batch32']
  stratify: False
  vocab_size: 5098 # from token dictionary ('/lustre/scratch126/cellgen/team361/DATASETS/tokenizer/cell-neighborhood-tokenizer/mmb0-1b_smb1-1b_1p/token_dictionary.pkl')
  seq_len_cell: 64
  seq_len_neighborhood: 640
  n_segments: 11 # number of unique segment tokens (gene segments)
  sampling_strategy: null # null, 'rand_sampling', 'norm_count_rank_sampling', 'rand_sampling_rep', 'norm_count_rank_sampling_rep'
  batch_size: 32
  num_workers: 6 
  pin_memory: True
meta:
  add_cls: True # True, False
  gt_type: 'counts' # 'rank', 'counts'
  enc_depth: 3
  enc_emb_dim: 768
  pred_depth: 1
  pred_emb_dim: 768
  special_tokens: ['batch'] # ['batch']
  pos_learnable: False
  seg_learnable: False
  use_bfloat16: True
  use_flash_attention: True
mask:
  n_contexts: 1
  n_targets: 5 # this is the number of blocks in block masking
  block_masking: True # this doesn't have meaning in block masking.
  context_mask_size: 200 # this doesn't have meaning in block masking.
  target_mask_size: 50 # this doesn't have meaning in block masking.
  per_block_mask_ratio: 0.5 # [0.5, 0.8]
  #controlled_attention_pattern:
  #  # Similarly, for the columns, we have the same order, and a 1 indicates attention get masked  between those two parts.
  #  # 'Matrix', 'null'
  #  - [0, 1, 0, 1] # cls
  #  - [0, 1, 0, 1] # genes
  controlled_attention_pattern: null
  controlled_attention_type: '' # 'pred'
  restrict_special_attention: True # True, False
optimization:
  warmup: 3
  epochs: 100
  ema:
  - 0.7
  - 1.0
  start_lr: 2.0e-05
  lr: 2.0e-05
  final_lr: 2.0e-05
  weight_decay: 0.04
  final_weight_decay: 0.4
  ipe_scale: 1.0
state:
  log_freq: 20
  checkpoint_freq: 5
  write_tag: nichejepa
  read_timestamp: ''
  load_checkpoint: False # true, false
  read_checkpoint: null # null, 'nichejepa-ep5.pth.tar'
