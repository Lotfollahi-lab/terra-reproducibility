experiment:
  experiment_name: "merfish_mouse_brain_2-batch"
  tokenizer: "cell-neighborhood-tokenizer"
  nproc: 2
  overwrite: False

dataset:
  dataset_ids: ["0"]
  assays: ["merfish"]
  animals: ["mouse"]
  tissues: ["brain"]
  species: ["mus_musculus"]
  n_batches: 2 # to be removed

wandb:
  project: "NicheJEPA"
  job_type: "create-tokenized-dataset"
  save_artifact: False
  mode: "offline"

paths:
  data_directory_path: "/lustre/scratch126/cellgen/team361/am84/NicheJEPA/datasets/am84/st_data/"
  tokenizer_directory_path: "/lustre/scratch126/cellgen/team361/am84/NicheJEPA/datasets/am84/tokenizer/"
  profiler_path: "/lustre/scratch126/cellgen/team361/am84/NicheJEPA/logs/"

tokenization:
  use_generator: True
  add_cls_tokens: False
  use_separate_cell_and_neighborhood_tokens: False
  norm_method: "shifted_log"
  norm_factor: "read_depth"
  prenormalize: False
  processing_mode: "parallel"
  custom_attr_name_dict: {"cell_type": "cell_types",
                          "brain_section_label": "brain_section_label",
                          "major_brain_region": "major_brain_region",
                          "ccf_region_name": "ccf_region_name",
                          "donor_id": "donor_id",
                          "batch": "batch_id"}
  num_shards: 2
  keep_in_memory: False
  label_cats: ["cell_types", "niche_types"]