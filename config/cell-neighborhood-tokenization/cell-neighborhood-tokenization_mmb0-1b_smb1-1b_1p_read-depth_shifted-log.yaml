experiment:
  experiment_name: "mmb0-1b_smb1-1b_1p" # merfish mouse brain (0) 1-batch, starmap mouse brain (1) 1-batch, 1-panel
  tokenizer: "cell-neighborhood-tokenizer"
  nproc: 2
  overwrite: False

tokenization:
  use_generator: True
  norm_method: "shifted_log"
  norm_factor: "read_depth"
  prenormalize: False
  processing_mode: "parallel"
  num_shards: 2
  keep_in_memory: False

wandb:
  project: "NicheJEPA"
  job_type: "create-tokenized-dataset"
  save_artifact: False
  mode: "offline"

paths:
  data_directory_path: "/lustre/scratch126/cellgen/team361/DATASETS/"
  tokenizer_directory_path: "/lustre/scratch126/cellgen/team361/DATASETS/tokenizer/"
  profiler_path: "/lustre/scratch126/cellgen/team361/am84/NicheJEPA/logs/"