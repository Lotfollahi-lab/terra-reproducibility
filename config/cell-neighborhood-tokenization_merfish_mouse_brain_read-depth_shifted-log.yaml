experiment:
  tokenizer: "cell-neighborhood-tokenizer"
  dataset_name: "merfish_mouse_brain"
  species: "mus_musculus"
  n_batches: 2
  nproc: 1
  overwrite: False
  # model_input_size: 2244 # uncomment to manually set the model input size

wandb:
  project: "NicheJEPA"
  job_type: "create-tokenized-dataset"
  save_artifact: False
  tags: ["test", "cell-neighborhood-tokenization", "merfish-mouse-brain", "read-depth", "shifted-log"]
  mode: "disabled"

paths:
  data_directory_path: "/lustre/scratch126/cellgen/team361/am84/NicheJEPA/datasets/am84/st_data/"
  tokenizer_directory_path: "/lustre/scratch126/cellgen/team361/am84/NicheJEPA/datasets/am84/tokenizer/"
  profiler_path: "/lustre/scratch126/cellgen/team361/am84/NicheJEPA/logs/profiler/"

tokenization:
  add_cls_tokens: False
  use_separate_cell_and_neighborhood_tokens: False
  norm_method: "shifted_log"
  norm_factor: "read_depth"
  custom_attr_name_dict: {"cell_types": "cell_types",
                          "niche_types": "niche_types"}
  label_cats: ["cell_types", "niche_types"]